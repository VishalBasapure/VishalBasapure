name: Update snail trail

on:
  schedule:
    - cron: '0 0 * * *'   # once a day, midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate snail-trail.svg
        run: python3 scripts/generate_snail.py VishalBasapure assets/snail-trail.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snail-trail.svg
          git diff --staged --quiet || git commit -m "chore: update snail contribution trail"
          git push
